- name: Prepare VPS for k0s
  hosts: bootstrap
  become: true
  vars:
    ssh_key_file: "files/id_ed25519.pub"

  tasks:
    - name: Update & upgrade system
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes

    - name: Ensure .ssh directory exists
      file:
        path: /home/{{ ansible_user }}/.ssh
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0700'

    - name: Add your SSH public key
      copy:
        src: "{{ ssh_key_file }}"
        dest: /home/{{ ansible_user }}/.ssh/authorized_keys
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Disable swap
      shell: |
        swapoff -a
        sed -i '/ swap / s/^/#/' /etc/fstab

    - name: Upgrade Ubuntu release (non-interactively)
      shell: |
        DEBIAN_FRONTEND=noninteractive do-release-upgrade -f DistUpgradeViewNonInteractive || true
      args:
        warn: false
      register: upgrade_result
      ignore_errors: true
    - name: Reboot after release upgrade
      reboot:
        msg: "Rebooting after Ubuntu release upgrade"
        pre_reboot_delay: 10
      when: upgrade_result.rc == 0