- name: Prepare VPS for k0s
  hosts: all
  become: true
  vars_files:
    - vars.yml

  tasks:
    - name: Update & upgrade system
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes

    - name: Ensure .ssh directory exists
      file:
        path: /home/{{ ansible_user }}/.ssh
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0700'

    - name: Add SSH key 
      copy:
        content: "{{ ssh_public_key }}"
        dest: "/home/{{ ansible_user }}/.ssh/authorized_keys"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Disable swap
      shell: |
        swapoff -a
        sed -i '/ swap / s/^/#/' /etc/fstab
