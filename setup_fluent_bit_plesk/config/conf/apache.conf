[INPUT]
    Name         tail
    Path         /var/www/vhosts/system/*/logs/access_log
    Path_Key     log_path
    Tag          apache.access.http
    DB           /var/lib/fluent-bit/apache.access.http.db
    Parser       apache
    Skip_Long_Lines  On
    Skip_Empty_Lines On
    #debug option
    #Read_from_Head    On

[INPUT]
    Name         tail
    Path         /var/www/vhosts/system/*/logs/access_https_log
    Path_Key     log_path
    Tag          apache.access.https
    DB           /var/lib/fluent-bit/apache.access.https.db
    Parser       apache
    Skip_Long_Lines  On
    Skip_Empty_Lines On
    #debug option
    #Read_from_Head    On

[INPUT]
    Name         tail
    Path         /var/www/vhosts/system/*/logs/error_log
    Path_Key     log_path
    Tag          apache.error
    DB           /var/lib/fluent-bit/apache.error.db
    Parser       apache_error
    #debug option
    #Read_from_Head    On



[FILTER]
    Name        modify
    Match       apache.access.https
    Add         log_type     https.access
    Add         protocol     https

[FILTER]
    Name        modify
    Match       apache.access.http
    Add         log_type     http.access
    Add         protocol     http

[FILTER]
    Name        modify
    Match       apache.error
    Add         log_type     apache.error


[FILTER]
    Name    grep
    Match   apache.error
    Exclude message "PHP Notice"
    Exclude message "Order properties should not be accessed directly"

[FILTER]
    Name         lua
    Match        *
    Script       /etc/fluent-bit/scripts/add_site_domain.lua
    Call         add_domain

#drop message by site domain if it occurs more than 500 times in 60s window check every 5 s
[FILTER]
    Name         lua
    Match        apache.error
    Script       /etc/fluent-bit/scripts/throttle_by_log_key.lua
    Call         throttle_by_key

