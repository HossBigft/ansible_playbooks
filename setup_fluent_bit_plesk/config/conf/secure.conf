[INPUT]
    Name         tail
    Path         /var/log/secure
    Path_Key     log_path
    Tag          secure
    DB           /var/lib/fluent-bit/secure.db
    Skip_Empty_Lines On
    #debug option
    #Read_from_Head    On

[FILTER]
    Name    parser
    Match   secure
    Key_Name log
    Parser  syslog-rfc3164-nopri


[FILTER]
    Name rewrite_tag
    Match secure
    Rule message .*sshd.* secure.sshd true


[FILTER]
    Name    parser
    Match   secure.sshd
    Key_Name message
    Parser  sshd_event
