[INPUT]
    Name              tail
    Path              /var/log/mail_log
    Parser            syslog-rfc3164-nopri
    Tag               mail
    DB           /var/lib/fluent-bit/dovecot.db
    Skip_Long_Lines   On
    #debug option
    #Read_from_Head    On


[FILTER]
    Name rewrite_tag
    Match mail
    Rule ident ^dovecot(-\w+)?$ dovecot true
    
# Drop successful logins (keep only failures)
[FILTER]
    Name   grep
    Match  dovecot
    Exclude message ^(imap|pop3)-login: Login: user=

# Drop routine mail delivery success messages
[FILTER]
    Name   grep
    Match  dovecot
    Exclude message ^service=lda.*saved mail to

# Drop routine sieve storage messages
[FILTER]
    Name   grep
    Match  dovecot
    Exclude message ^service=lda.*sieve.*stored mail into
    
# drop clean disconnects
[FILTER]
    Name    grep
    Match   dovecot
    Exclude message ^.*(Logged out|Connection closed).*

[FILTER]
    Name   grep
    Match  dovecot
    Exclude message ^service=lda.*sieve.*Execution of script.*failed

[FILTER]
    Name   grep
    Match  dovecot
    Exclude message ^(imap|pop3)-login: Disconnected 

[FILTER]
    Name    parser
    Match   dovecot
    Key_Name message
    Parser  dovecot_auth_failure
    Reserve_Data On

[FILTER]
    Name    parser
    Match   dovecot
    Key_Name message
    Parser  dovecot_warning
    Reserve_Data On

[FILTER]
    Name    parser
    Match   dovecot
    Key_Name message
    Parser  dovecot_error
    Reserve_Data On

[FILTER]
    Name    parser
    Match   dovecot
    Key_Name message
    Parser  dovecot_service_disconnect
    

#throttle inotify warn messages
[FILTER]
    Name      rewrite_tag
    Match     dovecot
    Rule      message  Inotify.*  dovecot.inotify.warn  true

[FILTER]
    Name         lua
    Match        dovecot
    Script       /etc/fluent-bit/scripts/dovecot.throttle_by_message_key.lua
    Call         throttle_by_key

[FILTER]
    Name   lua
    Match  dovecot
    Script /etc/fluent-bit/scripts/local_to_utc.lua
    Call   adjust_to_utc

#drop message by site domain if it occurs more than 100 times in 60s window check every 5 s
[FILTER]
    Name         lua
    Match        dovecot
    Script       /etc/fluent-bit/scripts/dovecot.throttle_by_message_key.lua
    Call         throttle_by_key

[FILTER]
    Name   lua
    Match  dovecot
    Script /etc/fluent-bit/scripts/local_to_utc.lua
    Call   adjust_to_utc


