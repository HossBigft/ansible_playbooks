[PARSER]
    Name        apache_custom
    Format      regex
    Regex       ^(?<host>[^ ]*)                    # host
                [^ ]*                              # unused field
                (?<user>[^ ]*)                     # user
                \[(?<time>[^\]]*)\]                # timestamp
                "                                  # opening quote for request
                (?<method>\S+)                     # HTTP method
                (?:\s+(?<path>[^\s"]*))?          # optional path
                (?:\s+(?<protocol>\S+))?           # optional protocol (HTTP/1.1)
                "                                  # closing quote
                (?<code>[^ ]*)                     # status code
                (?<size>[^ ]*)                     # response size
                (?:\s+"(?<referer>[^"]*)"\s+"(?<agent>[^"]*)")?  # optional referer & agent
    Time_Key    time
    Time_Format %d/%b/%Y:%H:%M:%S %z

