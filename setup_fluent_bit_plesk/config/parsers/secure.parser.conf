[PARSER]
    Name        sshd_login
    Format      regex
    Regex       (?<event>[^ ]+ [^ ]+) for user (?<user>\S+) by \(uid=(?<uid>\d+)\)
    Time_Key    time
    Time_Format %b %d %H:%M:%S

[PARSER]
    Name        sshd_key_accepted
    Format      regex
    Time_Key    time
    Time_Format %b %d %H:%M:%S
    Regex       ^(?<event>Accepted publickey)\sfor\s(?<user>\S+)\sfrom\s(?<ip>\S+)\sport\s(?<port>\d+)\s(?<protocol>\S+):\s(?<key>.+)$

