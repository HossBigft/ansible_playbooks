[PARSER]
    Name        syslog-rfc3164-nopri
    Format      regex
    Regex       /^(?<time>[^ ]* {1,2}[^ ]* [^ ]*) (?<host>[^ ]*) (?<ident>[a-zA-Z0-9_\/\.\-]*)(?:\[(?<pid>[0-9]+)\])?(?:[^\:]*\:)? *(?<message>.*)$/
    Time_Key    time
    Time_Format %b %d %H:%M:%S
    Time_Keep   On




[PARSER]
    Name        dovecot_service_disconnect
    Format      regex
    Regex       ^service=(?<service>[^,]+),\s+user=(?<user>[^,]+),\s+ip=\[(?<ip>[^\]]+)\]\.\s+Disconnected:\s+(?<disconnect_reason>.*?)\s+rcvd=(?<rcvd>\d+),\s+sent=(?<sent>\d+)$

[PARSER]
    Name        dovecot_auth_failure
    Format      regex
    Regex       ^(?<service>\w+)-login:\s+Disconnected:\s+(?<disconnect_reason>.*(?:Authentication failure|auth failed|Login failed).*):\s+user=<(?<user>[^>]*)>,\s*(?:method=(?<method>[^,]+),\s*)?rip=(?<remote_ip>[^,]+),\s*lip=(?<local_ip>[^,]+).*$

[PARSER]
    Name        dovecot_warning
    Format      regex
    Regex       ^service=(?<service>\w+),\s+user=(?<user>[^,]+),\s+ip=\[(?<ip>[^\]]*)\]\.\s+Warning:\s+(?<warning>.*)$

[PARSER]
    Name        dovecot_error
    Format      regex
    Regex       ^service=(?<service>[^,]+),\s+user=(?<user>[^,]+),\s+ip=\[(?<ip>[^\]]+)\]\.\s+Error:\s+(?<error_msg>.*)$

[PARSER]
    Name        dovecot_sieve_redirect
    Format      regex
    Regex       ^service=lda,\s+user=(?<user>[^,]+),\s+ip=\[(?<ip>[^\]]*)\]\.\s+sieve:\s+msgid=(?<msgid>[^:]*?):\s+(?<action>redirect action):\s+forwarded to\s+<(?<recipient>[^>]+)>$
