[PARSER]
    Name        dovecot
    Format      regex
    Regex       ^(?<timestamp>\w{3}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?<hostname>\S+)\s+dovecot\[(?<pid>\d+)\]:\s+(?<message>.*)$
    Time_Key    timestamp
    Time_Format %b %d %H:%M:%S

[PARSER]
    Name        dovecot_login
    Format      regex
    Regex       ^(?<service>\w+)-login:\s+Login:\s+user=<(?<user>[^>]*)>,\s+method=(?<method>\w+),\s+rip=(?<remote_ip>[^,]+),\s+lip=(?<local_ip>[^,]+),\s+mpid=(?<mail_pid>\d+)(?:,\s*(?<security>\w+))?(?:,\s*session=<(?<session_id>[^>]*)>?)?

[PARSER]
    Name        dovecot_login_disconnect
    Format      regex
    Regex       ^(?<service>\w+)-login:\s+Disconnected:\s+(?<disconnect_reason>[^:]+):\s+user=<(?<user>[^>]*)>,\s+rip=(?<remote_ip>[^,]+),\s+lip=(?<local_ip>[^,]+)(?:,\s+(?<tls_info>[^,]+))?(?:,\s+session=<(?<session_id>[^>]*)>)?

[PARSER]
    Name        dovecot_login_truncated
    Format      regex
    Regex       ^(?<service>\w+)-login:\s+Login:\s+user=<(?<user>[^>]*)(?<truncated>$)

[PARSER]
    Name        dovecot_lda_service
    Format      regex
    Regex       ^service=(?<service>\w+),\s+user=(?<user>[^,]+),\s+ip=\[(?<ip>[^\]]*)\](?:\.\s+msgid=<(?<message_id>[^>]+)>)?:\s+(?<action>.*)$

[PARSER]
    Name        dovecot_service_disconnect
    Format      regex
    Regex       ^service=(?<service>\w+),\s+user=(?<user>[^,]+),\s+ip=\[(?<ip>[^\]]+)\]\.\s+Disconnected:\s+(?<disconnect_reason>.*)$

[PARSER]
    Name        dovecot_login_any
    Format      regex
    Regex       ^(?<service>\w+)-login:\s+Login:\s+(?<login_data>.*)$

[PARSER]
    Name        dovecot_disconnect_any
    Format      regex
    Regex       ^(?<service>\w+)-login:\s+Disconnected:\s+(?<disconnect_data>.*)$

    