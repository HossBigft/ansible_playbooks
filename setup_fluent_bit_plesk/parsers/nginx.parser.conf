[PARSER]
    Name        nginx_error
    Format      regex
    Regex       ^(?<time>[^ ]+ [^ ]+) \[(?<level>[a-z]+)\] (?<pid>\d+)#(?<tid>\d+): \*(?<cid>\d+) (?<message>.*), client: (?<client>[^,]+), server: (?<server>[^,]+), request: "(?<request>[^"]+)", host: "(?<host>[^"]+)"$
    Time_Key    time
    Time_Format %Y/%m/%d %H:%M:%S