[INPUT]
    Name         tail
    Path         /var/www/vhosts/system/*/logs/proxy_access_log
    Path_Key     log_path
    Tag          proxy.access.http
    DB           /var/lib/fluent-bit/proxy.access.http.db
    Parser       apache
    Refresh_Interval 10
    Skip_Long_Lines  On
    Skip_Empty_Lines On

[INPUT]
    Name         tail
    Path         /var/www/vhosts/system/*/logs/proxy_access_https_log
    Path_Key     log_path
    Tag          proxy.access.https
    DB           /var/lib/fluent-bit/proxy.access.https.db
    Parser       apache
    Refresh_Interval 10
    Skip_Long_Lines  On
    Skip_Empty_Lines On

[INPUT]
    Name         tail
    Path         /var/www/vhosts/system/*/logs/proxy_error_log
    Path_Key     log_file
    Tag          proxy.error
    DB           /var/lib/fluent-bit/proxy.error.db
    Parser       nginx_error
    Refresh_Interval 10 




[FILTER]
    Name        modify
    Match       proxy.access.http
    Add         log.type     proxy.http.access
    Add         protocol     http

[FILTER]
    Name        modify
    Match       proxy.access.https
    Add         log.type     proxy.https.access
    Add         protocol     https

[FILTER]
    Name        modify
    Match       proxy.error
    Add         log.type     proxy.error


[FILTER]
    Name         add_site_domain
    Match        *
    Script       /etc/fluent-bit/scripts/add_site_domain.lua
    Call         add_domain


    
[OUTPUT]
    Name              opensearch
    Match             proxy.access*
    Host              89.35.125.137
    Port              9200
    HTTP_User         fluent_bit
    HTTP_Passwd       pass
    Suppress_Type_Name   On
    Index  proxy.access-%Y.%m.%d
    #options for test/dev only
    TLS           On
    tls.verify    Off

[OUTPUT]
    Name              opensearch
    Match             proxy.error
    Host              89.35.125.137
    Port              9200
    HTTP_User         fluent_bit
    HTTP_Passwd       pass
    Suppress_Type_Name   On
    Index             proxy.error-%Y.%m.%d
    #options for test/dev only
    TLS           On
    tls.verify    Off