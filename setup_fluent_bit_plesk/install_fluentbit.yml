---
- name: Install and configure Fluent Bit
  hosts: all
  become: true

  vars:
    fluentbit_repo_file: /etc/yum.repos.d/fluent-bit.repo
    fluentbit_repo_content: |
      [fluent-bit]
      name = Fluent Bit
      baseurl = https://packages.fluentbit.io/centos/$releasever/
      gpgcheck=1
      gpgkey=https://packages.fluentbit.io/fluentbit.key
      repo_gpgcheck=0
      enabled=1
    override_file: /etc/systemd/system/fluent-bit.service.d/override.conf
    override_content: |
      [Service]
      LimitNOFILE=16384
  
  vars_files:
    - vars/fluentbit.yml

  handlers:
    - name: Restart fluent-bit
      systemd:
        name: fluent-bit
        state: restarted
          
    - name: Reload CSF
      command: csf -r

  pre_tasks:
    - name: Assert required Fluent Bit variables are defined
      assert:
        that:
          - fluentbit_opensearch_api_domain is defined
          - fluentbit_opensearch_api_port is defined
          - fluentbit_opensearch_user is defined
          - fluentbit_opensearch_password is defined
        fail_msg: |
          One or more required Fluent Bit vars are missing.
          Please set fluentbit_opensearch_host, fluentbit_opensearch_api_port, and fluentbit_opensearch_password.
  tasks:

    - name: Add Fluent Bit repository (RedHat)
      yum_repository:
        name: fluent-bit
        description: Fluent Bit
        baseurl: "https://packages.fluentbit.io/centos/$releasever/"
        gpgcheck: yes
        gpgkey: https://packages.fluentbit.io/fluentbit.key
        enabled: yes
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Install Fluent Bit (RedHat)
      yum:
        name: fluent-bit
        state: present
      when: ansible_facts['os_family'] == 'RedHat'

    - name: Add Fluent Bit GPG key
      ansible.builtin.command: >
        sh -c "curl -fsSL https://packages.fluentbit.io/fluentbit.key |
              gpg --dearmor > /usr/share/keyrings/fluentbit-keyring.gpg"
      args:
        creates: /usr/share/keyrings/fluentbit-keyring.gpg
      become: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Add Fluent Bit APT repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/usr/share/keyrings/fluentbit-keyring.gpg] https://packages.fluentbit.io/ubuntu/{{ ansible_facts['distribution_release'] }} {{ ansible_facts['distribution_release'] }} main"
        state: present
        filename: fluent-bit
      become: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: yes
      become: true
      when: ansible_facts['os_family'] == 'Debian'

    - name: Install Fluent Bit (Debian/Ubuntu)
      ansible.builtin.apt:
        name: fluent-bit
        state: present
      become: true
      when: ansible_facts['os_family'] == 'Debian'
      
    - name: Add Fluent Bit bin path to system-wide PATH
      copy:
        dest: /etc/profile.d/fluent-bit-path.sh
        content: 'export PATH=$PATH:/opt/fluent-bit/bin'
        mode: '0755'

    - name: Create directory for Fluent Bit DB files
      file:
        path: /var/lib/fluent-bit
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Ensure systemd override directory exists
      file:
        path: /etc/systemd/system/fluent-bit.service.d
        state: directory
        mode: '0755'

    - name: Set systemd override for Fluent Bit
      copy:
        dest: "{{ override_file }}"
        content: "{{ override_content }}"
        owner: root
        group: root
        mode: '0644'
        
    - name: Copy Fluent Bit config structure to /etc/fluent-bit/
      synchronize:
        src: config/
        dest: /etc/fluent-bit/
        archive: yes
        recursive: yes
        delete: no
      notify: Restart fluent-bit

    - name: Deploy main fluent-bit.conf 
      template:
        src: config/fluent-bit.conf.j2
        dest: /etc/fluent-bit/fluent-bit.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart fluent-bit

    - name: Reload systemd daemon
      systemd:
        daemon_reload: true

    - name: Allow open search server in firewall
      blockinfile:
        path: /etc/csf/csf.allow.client
        marker: "# {mark} test_log_aggregation_server"
        block: |
          # test opensearch server
          tcp|in|d={{ fluentbit_opensearch_api_port }}|s={{ fluentbit_opensearch_api_ip }}
          tcp|out|d={{ fluentbit_opensearch_api_port }}|d={{ fluentbit_opensearch_api_ip }}
        create: yes
        owner: root
        group: root
        mode: '0644'
      notify: Reload CSF

    - name: Enable and start fluent-bit
      systemd:
        name: fluent-bit
        enabled: true
        state: started

    - name: Check OpenSearch accessibility 
      uri:
        url: "https://{{ fluentbit_opensearch_api_domain }}:{{ fluentbit_opensearch_api_port }}/"
        method: GET
        user: fluentbit
        password: "{{ fluentbit_opensearch_password }}"
        validate_certs: no
        return_content: yes
        status_code: 
          - 403
          - 200  
      register: opensearch_health

    - name: Ensure fluent-bit service is running
      systemd:
        name: fluent-bit
        state: started
        enabled: true
        
    - name: Check if fluent-bit is active
      shell: systemctl is-active fluent-bit
      register: fluentbit_status
      changed_when: false
      failed_when: fluentbit_status.stdout != "active"

    - name: Check if fluent-bit is failed
      shell: systemctl is-failed fluent-bit
      register: fluentbit_failed
      changed_when: false
      failed_when: fluentbit_failed.stdout == "failed"