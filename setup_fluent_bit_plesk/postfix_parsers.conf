[PARSER]
    Name        postfix
    Format      regex
    Regex       ^(?<timestamp>\w{3}\s+\d{1,2}\s+\d{2}:\d{2}:\d{2})\s+(?<hostname>\S+)\s+(?<process_name>\S+?)\[(?<pid>\d+)\]:\s+(?<message>.*)$
    Time_Key    timestamp
    Time_Format %b %d %H:%M:%S
    Time_Keep   On

[PARSER]
    Name        postfix_queue_id_parser
    Format      regex
    Regex       ^(?<queue_id>[A-F0-9]{8,}|[A-F0-9]{4,}[A-F0-9]+):\s+(?<message_content>.*)$

[PARSER]
    Name        postfix_warning_parser
    Format      regex
    Regex       ^(?<log_level>warning|error|fatal|panic):\s+(?<message_content>.*)$

[PARSER]
    Name        postfix_sasl_parser
    Format      regex
    Regex       ^(?<remote_host>\S+)\s*:\s*SASL\s+(?<sasl_method>\w+)\s+authentication\s+failed:\s+(?<failure_reason>[^,]+)(?:,\s*sasl_username=(?<sasl_username>\S+))?

[PARSER]
    Name        postfix_host_ip_parser
    Format      regex
    Regex       ^(?<hostname>[^\[]+)\[(?<ip>[^\]]+)\]

[PARSER]
    Name        postfix_from_to_parser
    Format      regex
    Regex       ^from=<(?<from_email>[^>]*)>,?\s*to=<(?<to_email>[^>]*)>

[PARSER]
    Name        postfix_delivery_parser
    Format      regex
    Regex       ^to=<(?<delivered_to>[^>]*)>,\s*relay=(?<relay>\S+),\s*delay=(?<delay>[\d.]+),\s*delays=(?<delays>[\d./]+),\s*dsn=(?<dsn>[\d.]+),\s*status=(?<status>\w+)\s*\((?<status_message>[^)]*)\)